
## Product
product.code.null=Se debe indicar un código para el producto.
product.name.null=Se debe indicar el nombre del producto.
product.brand.null=Se debe indicar la marca del producto.
product.price.null=Se debe indicar el precio del producto.
product.category.null=Se debe especificar una categoría.
product.price.min.value.error=El precio del producto debe ser mayor o igual a cero.
product.stock.null=Se debe indicar el stock del producto.
product.stock.min.value=El stock del producto debe ser mayor o igual a 0.

detail.product.code.null=Se debe indicar el código del producto.
detail.product.quantity.null=Se debe indicar la cantidad.
detail.product.quantity.positive.zero=La cantidad debe ser mayor a 0.