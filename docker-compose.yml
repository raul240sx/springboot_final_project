services:
  sales-db:
    image: mysql:latest
    ports:
      - 4444:3306
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
    volumes:
      - db_spring_sales:/var/lib/mysql
    networks:
      - store_network


  sales-api:
    build: .
    restart: unless-stopped
    depends_on:
      - sales-db
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_PUBLIC_KEY_LOCATION=${JWT_PUBLIC_KEY_LOCATION}
      - JWT_PRIVATE_KEY_LOCATION=${JWT_PRIVATE_KEY_LOCATION}
      - FIRST_USER_CODE=${FIRST_USER_CODE}
      - FIRST_USER_NAME=${FIRST_USER_NAME}
      - FIRST_USER_LAST_NAME=${FIRST_USER_LAST_NAME}
      - FIRST_USER_DNI=${FIRST_USER_DNI}
      - FIRST_USER_PASSWORD=${FIRST_USER_PASSWORD}

    networks:
      - store_network
    volumes:
      - ./secret:/app/secret:ro

  nginx-store-spring:
    image: nginx:stable-alpine
    container_name: nginx-store-spring
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sales-api
      - sales-db
    networks:
      - store_network

  cloudflared_sales_spring:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_sales_spring
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - nginx-store-spring
    networks:
      - store_network
    

networks:
  store_network:
    driver: bridge

volumes:
  db_spring_sales: