services:
  sales-db:
    image: mysql:latest
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - store_network


  sales-api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - sales-db
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    networks:
      - store_network

networks:
  store_network:
    driver: bridge

volumes:
  db_data: