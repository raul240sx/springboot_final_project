## Mensajes de Validacion para DTOs de entrada

## Product
product.code.null=Se debe indicar un código para el producto.
product.name.null=Se debe indicar el nombre del producto.
product.brand.null=Se debe indicar la marca del producto.
product.price.null=Se debe indicar el precio del producto.
product.category.null=Se debe especificar una categoría.
product.price.min.value.error=El precio del producto debe ser mayor o igual a cero.
product.stock.null=Se debe indicar el stock del producto.
product.stock.min.value=El stock del producto debe ser mayor o igual a 0.

## Client
client.name.null=Se debe indicar el nombre del cliente.
client.last.name.null=Se debe indicar el apellido del cliente.
client.dni.null=Se debe indicar el DNI del cliente.

## Detail
detail.product.code.null=Se debe indicar el código del producto.
detail.quantity.null=Se debe especificar la cantidad deseada.
detail.quantity.positive.zero=La cantidad debe ser mayor a cero.


## Sale
sale.client.code.null=Se debe indicar el código del cliente que realiza la compra.
sale.details.empty=La lista de detalles no debe estar vacía.

##Login
login.username.blank=Se debe indicar el nombre de usuario.
login.password.blank=Se debe indicar la contraseña.

## Vendor
vendor.name.null=Se debe indicar el nombre del vendedor.
vendor.last.name.null=Se debe indicar el apellido del vendedor.
vendor.dni.null=Se debe indicar el DNI del vendedor.
vendor.password.null=Se debe indicar la contraseña del vendedor.
confirmPassword=Se debe indicar la confirmación de la contraseña del vendedor.
vendor.request.vendor-code.null=Se debe indicar el codigo del vendedor
vendor.request.role-id.null=Se debe indicar el codigo del rol.

##Role
role.name.null=Se debe indicar el nombre del Rol.