spring:
  application:
    name: ms-registry-server

server:
  port: 8020
  ssl:
    enabled: true
    key-store: file:${KEYSTORE_LOCATION}
    key-store-password: ${KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-password: ${KEYSTORE_PASSWORD}
    trust-store: file:${TRUSTSTORE_LOCATION}
    trust-store-password: ${TRUSTSTORE_PASSWORD}
    trust-store-type: PKCS12
    client-auth: need

management:
  server:
    port: 9020
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

eureka:
  instance:
    hostname: ms-registry-server
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: https://${eureka.instance.hostname}:${server.port}/eureka/


